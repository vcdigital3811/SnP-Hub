<style>
:root{--bg:#0b1020;--sf:#121a33;--tx:#e8f0ff;--mut:#8fa0c4;--ac:#3de6ff;--coin:#3de6ff;--ln:#1f2b4d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}


html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:20px 18px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:10px;font:800 28px/1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.5px}
.logo i{font-style:normal;color:var(--ac)}
.btn{font:inherit;font-weight:600;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:99px;padding:8px 18px;cursor:pointer}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--coin);color:#06101f;border-color:var(--coin)}
.btn.sm{padding:6px 18px;font-size:14px}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.qr{margin:0;text-align:center;font:12px ui-monospace,Consolas,monospace;letter-spacing:.15em;color:var(--mut)}
.qr img{display:block;width:112px;height:112px;border-radius:14px;border:3px solid var(--ac);margin-bottom:6px}
.hero{padding:56px 0 28px}
h1{font:800 clamp(34px,7vw,64px)/1 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 8px;letter-spacing:-1.5px;background:linear-gradient(90deg,#3de6ff,#5aa9ff 60%,#3b7bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);margin:0 0 22px}
.search{width:100%;font:inherit;font-size:20px;padding:16px 20px;border:1px solid var(--ln);border-radius:12px;background:var(--sf);color:var(--tx)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 24px}
.tag{font:14px ui-monospace,"JetBrains Mono",Consolas,monospace;border:1.5px solid var(--ln);background:transparent;color:var(--tx);border-radius:99px;padding:4px 12px;cursor:pointer}
.tag[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:#06101f}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--sf);border:1px solid var(--ln);border-top:3px solid var(--ac);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.thumb{height:110px;display:flex;align-items:center;justify-content:center;font:800 54px/1 "Bricolage Grotesque",system-ui,sans-serif;color:rgba(255,255,255,.92);border-bottom:2px solid var(--tx)}
.cat{font:600 12px ui-monospace,Consolas,monospace;letter-spacing:.15em;text-transform:uppercase;color:var(--ac)}
.body{padding:18px;display:flex;flex-direction:column;gap:6px;flex:1}
.body h3{margin:0;font:800 19px/1.2 "Bricolage Grotesque",system-ui,sans-serif}
.body p{margin:0;color:var(--mut);font-size:14px;flex:1}
.chips{font-size:12px;color:var(--mut)}
.acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.acts a{text-decoration:none}
.empty{border:2px dashed var(--ln);border-radius:14px;padding:40px 20px;text-align:center;color:var(--mut)}
dialog{border:2px solid var(--tx);border-radius:14px;background:var(--sf);color:var(--tx);width:min(460px,92vw);padding:20px}
dialog::backdrop{background:rgba(10,8,20,.6)}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input.f,textarea.f{width:100%;font:inherit;padding:9px 11px;border:1.5px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx)}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.err{color:#d6336c;font-size:13px;min-height:18px;margin-top:6px}
.foot{margin-top:36px;color:var(--mut);font-size:13px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
</style>
</head>

    <input class="f" id="g" placeholder="puzzle, 2D, multiplayer">
    <div class="err" id="err" role="alert"></div>
    <div class="row"><button class="btn" id="cx" type="button">Cancel</button><button class="btn pri" id="sv" type="button">Save game</button></div>
  </div>
</dialog>
<input type="file" id="file" accept="application/json" hidden>

<script>
// Games that ship with the page. Add yours here to make them visible to everyone:
// { title:"My Game", repo:"https://github.com/you/my-game", play:"", desc:"Short blurb", tags:["puzzle"] }
const BUILT_IN = [
{title:"Dead Hour",repo:"https://github.com/vcdigital3811/Dead-Hour",desc:"Survive the zombie apocalypse.",tags:["Survival"]},
{title:"Hallow Stations",repo:"https://github.com/vcdigital3811/Hallow-Stations",desc:"Stay alive and avoid getting killed by the Saboteur.",tags:["Survival"]},
{title:"Plane Landing Challenge",repo:"https://github.com/vcdigital3811/Plane-Landing-Challenge",desc:"Bring your plane in for a safe landing.",tags:["Flight"]},
{title:"Plane Game RS",repo:"https://github.com/vcdigital3811/Plane-Game-rs",desc:"Fly your plane and dodge the obstacles.",tags:["Flight"]},
{title:"Blockland",repo:"https://github.com/vcdigital3811/Blockland",desc:"Mine and build in a Minecraft-style world.",tags:["Survival"]},
{title:"Captain Sim",repo:"https://github.com/vcdigital3811/Captain-Sim",desc:"Take the controls in a flight simulator.",tags:["Flight"]},
{title:"Ping Pong",repo:"https://github.com/vcdigital3811/ping-pong-game",desc:"Classic ping-pong. Rally and score.",tags:["Arcade"]},
{title:"Asteroid Dodger",repo:"https://github.com/vcdigital3811/astroid-dodger",desc:"Dodge the asteroids in space.",tags:["Arcade"]},
{title:"Beat The Line",repo:"https://github.com/vcdigital3811/Beat-The-Line",desc:"Don't let the bullets get across the line.",tags:["Arcade"]},
{title:"Robot Runner",repo:"https://github.com/vcdigital3811/Robot-Runner",desc:"Run as a robot and dodge all obstacles.",tags:["Arcade"]},
{title:"Lane Racer",repo:"https://github.com/vcdigital3811/Lane-Racer",desc:"Drive and dodge all the cars.",tags:["Racing"]},
{title:"Apex Horizon",repo:"https://github.com/vivaanc235/Apex-Horizon",desc:"Drive and race.",tags:["Racing"]}
];

const KEY = "sp-games-v1";
let mine = [], activeTag = "", query = "";
const $ = id => document.getElementById(id);

try { mine = JSON.parse(localStorage.getItem(KEY) || "[]"); if (!Array.isArray(mine)) mine = []; } catch (e) { mine = []; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(mine)); } catch (e) {} }

function parseRepo(u) {
  try {
    const x = new URL(u.trim());
    if (x.hostname !== "github.com") return null;
    const [o, r] = x.pathname.split("/").filter(Boolean);
    return o && r ? { o, r: r.replace(/\.git$/, "") } : null;
  } catch (e) { return null; }
}
function playUrl(g) {
  if (g.play) return g.play;
  const p = parseRepo(g.repo);
  return p ? `https://${p.o.toLowerCase()}.github.io/${p.r}/` : g.repo;
}
function hue(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function safe(u) { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : "#"; } catch (e) { return "#"; } }

function all() { return [...BUILT_IN.map(g => ({...g, own:false})), ...mine.map((g, i) => ({...g, own:true, i}))]; }

function render() {
  const games = all();
  $("count").textContent = games.length + (games.length === 1 ? " game" : " games");
  const tags = [...new Set(games.flatMap(g => g.tags || []))].sort();
  $("tags").innerHTML = tags.map(t => `<button class="tag" aria-pressed="${t === activeTag}" data-t="${esc(t)}">${esc(t)}</button>`).join("");
  const q = query.toLowerCase();
  const list = games.filter(g => (!activeTag || (g.tags || []).includes(activeTag)) &&
    (!q || [g.title, g.desc, ...(g.tags || [])].join(" ").toLowerCase().includes(q)));
  if (!list.length) {
    $("grid").innerHTML = `<div class="empty" style="grid-column:1/-1">${games.length ? "No games match that search." : "No games yet."}</div>`;
    return;
  }
  $("grid").innerHTML = list.map(g => {
    const h = hue(g.title);
    return `<article class="card">
      
      <div class="body"><div class="cat">${esc((g.tags || [])[0] || "game")}</div><h3>${esc(g.title)}</h3><p>${esc(g.desc || "")}</p>
      <div class="chips">${esc((g.tags || []).join(", "))}</div>
      <div class="acts"><a class="btn sm pri" href="${esc(safe(playUrl(g)))}" target="_blank" rel="noopener">Play</a>
      
      ${g.own ? `<button class="btn sm" data-del="${g.i}">Remove</button>` : ""}</div></div></article>`;
  }).join("");
}

$("q").addEventListener("input", e => { query = e.target.value; render(); });
$("tags").addEventListener("click", e => { const t = e.target.dataset.t; if (t === undefined) return; activeTag = activeTag === t ? "" : t; render(); });
$("grid").addEventListener("click", e => {
  const i = e.target.dataset.del;
  if (i !== undefined && confirm("Remove this game from your list?")) { mine.splice(+i, 1); save(); render(); }
});

if ($("add")) $("add").onclick = () => { ["t","r","p","d","g"].forEach(k => $(k).value = ""); $("err").textContent = ""; $("dlg").showModal(); $("t").focus(); };
$("cx").onclick = () => $("dlg").close();
$("sv").onclick = () => {
  const title = $("t").value.trim(), repo = $("r").value.trim(), play = $("p").value.trim();
  if (!title) return $("err").textContent = "Add a title.";
  if (!parseRepo(repo)) return $("err").textContent = "Enter a GitHub link like https://github.com/you/your-game.";
  if (play && safe(play) === "#") return $("err").textContent = "The play URL must start with http:// or https://.";
  mine.push({ title, repo, play, desc: $("d").value.trim(), tags: $("g").value.split(",").map(s => s.trim()).filter(Boolean) });
  save(); $("dlg").close(); render();
};

if ($("exp")) $("exp").onclick = () => {
  const a = document.createElement("a");
  a.href = "data:application/json;charset=utf-8," + encodeURIComponent(JSON.stringify(mine, null, 2));
  a.download = "sp-games.json"; a.click();
};
if ($("imp")) $("imp").onclick = () => $("file").click();
$("file").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!Array.isArray(d)) throw 0;
      mine = d.filter(g => g && g.title && parseRepo(g.repo || ""));
      save(); render();
    } catch (x) { alert("That file isn't a valid S&P Games list."); }
  };
  r.readAsText(f); e.target.value = "";
};
render();
</script>
</body>
</html>
